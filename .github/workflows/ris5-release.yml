# RIS 5 release: tag v5.x.y (or v5.x.y-rc1 for a prerelease) -> tested build, installer, GitHub release.
name: RIS 5 release

on:
  push:
    tags: ["v5.*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag ${{ github.ref_name }} is not v<major>.<minor>.<patch>[-suffix]." }
          "value=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build RIS5.slnx -c Release --nologo -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test RIS5.slnx -c Release --no-build --nologo --filter "TestCategory!=Integration"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Name -like "RIS5-Setup-*" -or $_.Name -like "ris-cli-*.zip" } | ForEach-Object { $_.FullName }
          $flags = @("--title", "Recurring Integrations Scheduler ${{ steps.version.outputs.value }}", "--generate-notes")
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") { $flags += "--prerelease" }
          gh release create "${{ github.ref_name }}" @files @flags
